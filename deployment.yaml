
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-portal
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hospital-portal
  template:
    metadata:
      labels:
        app: hospital-portal
    spec:
      containers:
        - name: hospital-portal
          image: 24mis0545/hospital-portal:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: hospital-portal-service
spec:
  type: NodePort
  selector:
    app: hospital-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30012
